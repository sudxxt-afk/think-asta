services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thinkasta
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: thinkasta
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkasta"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: tools }
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://thinkasta:${DB_PASSWORD}@db:5432/thinkasta
    command: sh -c "npx prisma db push --skip-generate && npx tsx prisma/seed.ts"
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://thinkasta:${DB_PASSWORD}@db:5432/thinkasta
    volumes: ["uploads:/data/uploads"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    dns: ["1.1.1.1", "8.8.8.8"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
